# OPC UA Configuration
opc:
  port: 4840
  endpoint: 'opc.tcp://localhost:4840'
  security:
    policy: 'None'
    mode: 'None'
  server:
    applicationName: 'OPC CNC Hub'
    applicationUri: 'urn:opc-cnc-hub:server'
    productName: 'OPC CNC Hub'
    productUri: 'urn:opc-cnc-hub:product'

# MQTT Configuration
mqtt:
  broker: 'mqtt://10.0.5.21:1883'
  clientId: 'opc-cnc-hub'
  username: roman
  password: 12345678u
  qos: 0
  reconnectPeriod: 5000
  connectTimeout: 10000
  clean: true
  retryDelay: 1000
  retryAttempts: 10
  maxDelay: 30000
  backoffMultiplier: 2
# Event Buffer Configuration (In-Memory Only)
eventBuffer:
  maxSize: 10000
  overflowPolicy: 'DROP_OLDEST' # "DROP_OLDEST" | "REJECT"
  retryAttempts: 3
  retryDelay: 1000
  maxAge: 30000 # 30 seconds - события старше 30с отбрасываются

# Database Configuration
database:
  host: '10.0.5.21'
  port: 5433
  database: 'config_opc_db'
  username: 'machines_opc_owner'
  password: 'qwerty6'
  ssl: false
  synchronize: true
  autoLoadEntities: true

# OPC Projection Configuration
opcProjection:
  batchSize: 100
  batchInterval: 50
  changeDetection: true

# Security Configuration
security:
  jwt:
    secret: 'your-secret-key-change-in-production'
    expiresIn: '24h'
    refreshTokenExpiresIn: '7d'
  apiKeys:
    enabled: true
  rateLimiting:
    enabled: true
    windowMs: 60000
    maxRequests: 100

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true

# Logging Configuration
logging:
  level: 'INFO' # "DEBUG" | "INFO" | "WARN" | "ERROR"
  transports:
    - type: 'console'
    - type: 'file'
      filename: 'logs/combined.log'
      maxsize: 10485760 # 10MB
      maxFiles: 5